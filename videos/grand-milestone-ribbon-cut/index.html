<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #160b10;
      }
      #main {
        position: relative;
        width: 100%;
        height: 100%;
        background: #160b10;
      }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="ribbon-cut"
        data-composition-id="ribbon-cut"
        data-composition-src="compositions/ribbon-cut.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Music: original score, timed to the picture (track 1) -->
      <audio id="score" src="assets/audio/score.wav" data-start="0" data-duration="10" data-track-index="1" data-volume="0.8"></audio>

      <!-- Sound design (tracks 2-4) -->
      <audio id="sfx-ribbon-whoosh" src="assets/audio/sfx-whoosh-short.mp3" data-start="0.08" data-duration="0.57" data-track-index="2" data-volume="0.45"></audio>
      <audio id="sfx-scissors-glide" src="assets/audio/sfx-whoosh-short.mp3" data-start="1.75" data-duration="0.57" data-track-index="2" data-volume="0.22"></audio>
      <audio id="sfx-riser" src="assets/audio/sfx-riser.mp3" data-start="1.21" data-media-start="2.4" data-duration="1.72" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-snip" src="assets/audio/snip.wav" data-start="2.895" data-duration="0.6" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-impact" src="assets/audio/sfx-impact-bass-1.mp3" data-start="2.95" data-duration="2.1" data-track-index="2" data-volume="0.42"></audio>
      <audio id="sfx-sparkle" src="assets/audio/sfx-sparkle.mp3" data-start="2.98" data-duration="1.8" data-track-index="3" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
