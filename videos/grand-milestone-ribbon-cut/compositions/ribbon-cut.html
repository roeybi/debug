      <script>
      const CUT = 2.95; // the snip — every later beat keys off it
      const CX = 600; // cut point = where the stand's own bow sits after the reveal
      const CY = 820;

      const tl = gsap.timeline({ paused: true });

      // ---------- Ambient: the glow breathes, ghost type drifts ----------
      tl.fromTo("#glow", { scale: 0.9, opacity: 0.7 }, { scale: 1.08, opacity: 1, duration: 2.95, ease: "sine.inOut" }, 0);
      tl.to("#glow", { scale: 1.3, opacity: 0, duration: 1.2, ease: "power2.out" }, CUT);
      tl.fromTo("#ghost", { x: 60, opacity: 0 }, { x: -60, opacity: 1, duration: 2.65, ease: "none" }, 0);
      tl.to("#ghost", { opacity: 0, duration: 0.5, ease: "power1.in" }, CUT - 0.3);

      // ---------- Act 1: the ribbon unfurls ----------
      tl.fromTo(
        "#ribbon-inner",
        { clipPath: "inset(0px 1080px 0px 0px)" },
        { clipPath: "inset(0px 0px 0px 0px)", duration: 0.8, ease: "power3.inOut" },
        0.1,
      );
      tl.fromTo("#sheen-1", { x: -320 }, { x: 1100, duration: 1.0, ease: "power2.inOut" }, 0.55);
      tl.fromTo("#sheen-1", { x: -320 }, { x: 1100, duration: 0.75, ease: "power2.inOut", immediateRender: false }, 2.05);

      tl.fromTo(
        "#pre-label",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
        0.95,
      );
      tl.fromTo("#pre-line", { yPercent: 105 }, { yPercent: 0, duration: 0.75, ease: "power3.out" }, 1.1);
      tl.to(["#pre-label", "#pre-line-wrap"], { opacity: 0, y: -14, duration: 0.4, ease: "power2.in" }, CUT - 0.5);

      // ---------- Act 2: the scissors glide in, open, and snip ----------
      tl.fromTo(
        "#scissors",
        { x: 640, rotation: -10, opacity: 0 },
        { x: 0, rotation: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
        1.7,
      );
      tl.fromTo("#blade-upper", { rotation: -15, svgOrigin: "142 100" }, { rotation: -15, svgOrigin: "142 100", duration: 0.01 }, 0);
      tl.fromTo("#blade-lower", { rotation: 15, svgOrigin: "142 100" }, { rotation: 15, svgOrigin: "142 100", duration: 0.01 }, 0);
      tl.to("#blade-upper", { rotation: 0, duration: 0.23, ease: "power4.in" }, CUT - 0.23);
      tl.to("#blade-lower", { rotation: 0, duration: 0.23, ease: "power4.in" }, CUT - 0.23);
      tl.to("#scissors", { x: -26, duration: 0.12, ease: "power2.out" }, CUT);
      tl.to("#scissors", { x: 720, rotation: 8, opacity: 0, duration: 0.55, ease: "power2.in" }, CUT + 0.15);

      // ---------- The cut: halves snap apart and fall ----------
      tl.to("#half-l", { x: -26, duration: 0.14, ease: "expo.out" }, CUT);
      tl.to("#half-r", { x: 26, duration: 0.14, ease: "expo.out" }, CUT);
      tl.to("#half-l", { rotation: 42, duration: 1.15, ease: "power2.in" }, CUT + 0.06);
      tl.to("#half-r", { rotation: -42, duration: 1.15, ease: "power2.in" }, CUT + 0.06);
      tl.to(["#half-l", "#half-r"], { y: 1500, duration: 1.2, ease: "power3.in" }, CUT + 0.2);
      tl.to("#sheen-band", { opacity: 0, duration: 0.05 }, CUT);
      tl.set("#half-whole", { opacity: 0 }, CUT);

      tl.fromTo("#flash", { scale: 0.15, opacity: 0 }, { scale: 0.7, opacity: 1, duration: 0.12, ease: "power2.out" }, CUT);
      tl.to("#flash", { scale: 1.9, opacity: 0, duration: 0.9, ease: "power2.out" }, CUT + 0.12);

      // Sparks — seeded, ballistic, a pure function of timeline time (particle-burst rule).
      const prand = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const field = document.getElementById("particle-field");
      const palette = ["#ffe0a3", "#f7b9c6", "#fff3e6", "#e2bb73"];
      const COUNT = 44;
      const FLIGHT = 1.6;
      const G = 1100;
      const parts = [];
      for (let i = 0; i < COUNT; i++) {
        const el = document.createElement("div");
        el.className = "particle";
        const size = 5 + prand(i * 3 + 1) * 9;
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.marginLeft = -size / 2 + "px";
        el.style.marginTop = -size / 2 + "px";
        el.style.background = palette[i % palette.length];
        el.style.boxShadow = "0 0 " + Math.round(size * 1.6) + "px " + palette[i % palette.length];
        field.appendChild(el);
        const angle = -Math.PI / 2 + (prand(i * 5 + 2) * 2 - 1) * Math.PI * 0.85;
        const speed = 260 + prand(i * 7 + 3) * 720;
        parts.push({ el, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed });
      }
      const drive = { T: 0 };
      const placeParts = () => {
        const t = drive.T * FLIGHT;
        const fade = drive.T <= 0 ? 0 : Math.min(1, (1 - drive.T) / 0.45);
        for (const p of parts) {
          const x = p.vx * t;
          const y = p.vy * t + 0.5 * G * t * t;
          p.el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
          p.el.style.opacity = fade.toFixed(3);
        }
      };
      tl.fromTo(drive, { T: 0 }, { T: 1, duration: FLIGHT, ease: "none", onUpdate: placeParts }, CUT);

      // ---------- Act 3: the stand is revealed in warm light ----------
      const photoLayer = document.getElementById("photo-layer");
      const iris = { r: 0 };
      const FEATHER = 240;
      const setIris = () => {
        const r = iris.r;
        const m =
          "radial-gradient(circle at " + CX + "px " + CY + "px, #000 " +
          Math.max(0, r - FEATHER).toFixed(1) + "px, transparent " + r.toFixed(1) + "px)";
        photoLayer.style.webkitMaskImage = m;
        photoLayer.style.maskImage = m;
      };
      tl.fromTo(iris, { r: 0 }, { r: 1560, duration: 1.5, ease: "power3.out", onUpdate: setIris, immediateRender: false }, CUT);

      tl.fromTo("#photo-zoom", { scale: 1.16 }, { scale: 1.0, duration: 6.6, ease: "power2.out" }, CUT);
      tl.fromTo("#vignette", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "sine.inOut" }, CUT + 0.4);

      tl.fromTo("#leak", { opacity: 0 }, { opacity: 0.85, duration: 0.4, ease: "sine.out" }, CUT);
      tl.to("#leak", { opacity: 0, duration: 1.6, ease: "sine.in" }, CUT + 0.45);
      tl.fromTo(".leak-a", { xPercent: -14, rotation: -4 }, { xPercent: 12, rotation: 2, duration: 2.2, ease: "sine.inOut" }, CUT);
      tl.fromTo(".leak-b", { xPercent: 12, yPercent: -6 }, { xPercent: -10, yPercent: 6, duration: 2.2, ease: "sine.inOut" }, CUT);

      // ---------- Act 4: the name lands ----------
      tl.fromTo(
        "#card-label",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
        4.7,
      );
      tl.fromTo(["#w1", "#w2"], { yPercent: 110 }, { yPercent: 0, duration: 0.9, ease: "power3.out", stagger: 0.14 }, 4.85);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 5.55);

      // One warm key-light pass across the frame (light-sweep-pass technique).
      tl.fromTo("#sweep-band", { x: -700, rotation: 14 }, { x: 1300, rotation: 14, duration: 1.4, ease: "power2.inOut" }, 5.6);
      tl.fromTo("#sweep", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.out" }, 5.6);
      tl.to("#sweep", { opacity: 0, duration: 0.3, ease: "power1.in" }, 6.7);

      // Detail lines rotate through one slot, ending on the brand.
      tl.fromTo("#detail-a", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.15);
      tl.to("#detail-a", { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, 7.35);
      tl.fromTo("#detail-b", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.6);
      tl.to("#detail-b", { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, 8.5);
      tl.fromTo("#brand", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 8.75);

      setIris();
      placeParts();
      window.__timelines["ribbon-cut"] = tl;
      tl.seek(0);
          </script>
    </template>
  </body>
